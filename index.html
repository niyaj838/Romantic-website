<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>A Little Surprise ❤️</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      font-family: Arial, sans-serif;
      color: white;
      background:
        radial-gradient(circle at top, #7b1e3b, #210812 70%);
      overflow: hidden;
    }

    .container {
      width: 90%;
      max-width: 600px;
      padding: 35px 20px;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 25px;
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(10px);
      box-shadow: 0 0 30px rgba(255, 0, 100, 0.2);
    }

    h1 {
      font-size: clamp(28px, 7vw, 48px);
      margin-bottom: 15px;
    }

    p {
      font-size: clamp(15px, 4vw, 19px);
      line-height: 1.6;
    }

    .button {
      display: inline-block;
      margin-top: 20px;
      padding: 15px 25px;
      border-radius: 30px;
      background: #ff4f81;
      color: white;
      text-decoration: none;
      font-weight: bold;
      transition: 0.3s;
    }

    .button:hover {
      transform: scale(1.08);
      background: #ff1f65;
    }

    .heart {
      position: absolute;
      bottom: -30px;
      animation: float 8s linear infinite;
      opacity: 0.7;
    }

    @keyframes float {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0;
      }

      20% {
        opacity: 1;
      }

      100% {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
      }
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>This is NOT a love letter. 🙄</h1>

    <p>
      Just a small experiment to test your curiosity.
      Nothing romantic. Probably.
    </p>

    <a class="button" href="FLORES.html">
      Click Me ❤️
    </a>
  </div>

  <script>
    function createHeart() {
      const heart = document.createElement("div");

      heart.className = "heart";
      heart.innerHTML = "❤️";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.fontSize = (15 + Math.random() * 25) + "px";
      heart.style.animationDuration = (5 + Math.random() * 5) + "s";

      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 10000);
    }

    setInterval(createHeart, 500);
  </script>

</body>
</html>
